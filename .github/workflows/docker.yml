name: build-and-push

# Same release shape as Nitin's other Unraid apps (HomeLabber, Cody):
#   * a push to main builds nothing;
#   * dispatching this workflow WITH a version (X.Y.Z, no leading v) cuts a release: the image is tagged X.Y.Z and
#     latest, a v-tag is created, and a GitHub Release is published whose body is `notes` (the changelog the ShipLog
#     plugin shows in Unraid's Docker tab);
#   * dispatching WITHOUT a version only proves the image builds and runs (sha tag, `latest` does not move).
# Agent sessions cannot push tags through the git proxy, which is why the versioned dispatch exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z, no leading v). Empty = build and test only, no release.'
        required: false
        type: string
      notes:
        description: 'Release notes / changelog (markdown), shown by ShipLog'
        required: false
        type: string

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ffmpeg (the AAC tests need it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version != '' && inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev') }}
    steps:
      - uses: actions/checkout@v4

      # The image carries the CUDA runtime, onnxruntime, three ONNX models and (during the build only) TensorFlow:
      # make room on the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nphil/kestrel-audio
          # :latest moves ONLY on a release, so the pulled image always carries a real
          # org.opencontainers.image.version label (ShipLog resolves it to this repo's GitHub Releases).
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      # Build once into the local daemon and prove the image runs BEFORE anything reaches the registry: a published
      # :latest is pulled by Unraid, so a broken one is a broken service, not just a red check.
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kestrel-audio:smoke
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test the image on the CPU path (the runner has no GPU)
        run: python3 tools/smoke_test.py kestrel-audio:smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  # Publishes the GitHub Release that is the image's changelog.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Resolve tag + notes
        id: rel
        env:
          NOTES_INPUT: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<SHIPLOG_EOF'
              printf '%s\n' "$NOTES_INPUT"
              echo SHIPLOG_EOF
            } >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<SHIPLOG_EOF'
              git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
              echo SHIPLOG_EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Kestrel Audio ${{ steps.rel.outputs.tag }}
          body: ${{ steps.rel.outputs.body }}
          generate_release_notes: true
          make_latest: true
